[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "acoustic-sync"
version = "0.1.0"
description = "Local acoustic synchronization and Premiere-compatible FCP7 XML export"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy==2.5.3", "scipy==1.18.1", "jsonschema==4.26.0"]

[project.optional-dependencies]
web = ["fastapi==0.141.1", "uvicorn==0.52.4"]
dev = ["pytest==9.1.1", "httpx==0.28.1", "psutil==7.2.2", "build==1.6.0"]

[project.scripts]
acoustic-sync = "acoustic_sync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
acoustic_sync = ["schemas/*.json", "web/static/*", "web/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ffmpeg: integration test requiring ffmpeg and ffprobe"]
